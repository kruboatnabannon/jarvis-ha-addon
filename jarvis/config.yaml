name: "J.A.R.V.I.S. Brain Core (v2.7.2)"
description: "ระบบสมองกลาง AI ผู้ช่วยส่วนตัวรอบด้าน (J.A.R.V.I.S. v2.7.2) รันตลอด 24 ชม. บน Home Assistant OS รองรับคำสั่งเสียง อุปกรณ์บ้าน และเชื่อมต่อ Android / Mac / Tailscale"
version: "2.7.2"
slug: "jarvis_brain"
init: false
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
host_network: true
homeassistant_api: true
hassio_api: true
hassio_role: default
ports:
  5050/tcp: 5050
options:
  gemini_api_key: ""
  mac_agent_url: "http://192.168.1.100:5050"
  speech_language: "th"
schema:
  gemini_api_key: password?
  mac_agent_url: str?
  speech_language: list(th|en)?
